<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Shahbaz Sharif Caricature - double chin + serious expression -->
  <defs>
    <radialGradient id="ssSkin" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0d0a0"/>
      <stop offset="100%" stop-color="#c8a070"/>
    </radialGradient>
    <linearGradient id="ssShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#145a32"/>
      <stop offset="100%" stop-color="#0d3d20"/>
    </linearGradient>
  </defs>

  <!-- Body/Shoulders -->
  <path d="M35 200 Q35 155 100 150 Q165 155 165 200 L165 240 L35 240 Z" fill="url(#ssShirt)"/>
  
  <!-- PM Sash -->
  <path d="M50 160 L150 190 L145 200 L45 170 Z" fill="#c0392b" opacity="0.85"/>
  <text x="100" y="185" text-anchor="middle" font-family="Arial" font-size="7" fill="#ffd700" transform="rotate(-18,100,183)">PRIME MINISTER</text>

  <!-- Suit collar -->
  <path d="M75 160 L100 175 L125 160 L120 155 L80 155 Z" fill="#1a1a1a"/>

  <!-- Neck (thick) -->
  <rect x="82" y="140" width="36" height="25" fill="url(#ssSkin)"/>
  <!-- Double chin -->
  <ellipse cx="100" cy="148" rx="20" ry="8" fill="url(#ssSkin)" opacity="0.8"/>

  <!-- Head (rounder, fuller) -->
  <ellipse cx="100" cy="95" rx="42" ry="48" fill="url(#ssSkin)"/>
  
  <!-- Hair (short, dark, slicked) -->
  <path d="M58 75 Q60 45 100 42 Q140 45 142 75 Q140 68 130 65 Q115 60 100 60 Q85 60 70 65 Q60 68 58 75 Z" fill="#2c2c2c"/>
  <path d="M60 72 Q65 50 80 46" stroke="#444" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Ears -->
  <ellipse cx="60" cy="100" rx="7" ry="11" fill="url(#ssSkin)"/>
  <ellipse cx="140" cy="100" rx="7" ry="11" fill="url(#ssSkin)"/>

  <!-- Eyebrows (thick, serious) -->
  <path d="M70 85 Q82 80 94 85" stroke="#2c2c2c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M106 85 Q118 80 130 85" stroke="#2c2c2c" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="82" cy="95" rx="5" ry="4" fill="white"/>
  <ellipse cx="118" cy="95" rx="5" ry="4" fill="white"/>
  <circle cx="82" cy="95" r="2.5" fill="#2c3e50"/>
  <circle cx="118" cy="95" r="2.5" fill="#2c3e50"/>
  <circle cx="83" cy="94" r="0.8" fill="white"/>
  <circle cx="119" cy="94" r="0.8" fill="white"/>

  <!-- Glasses (signature SS look) -->
  <circle cx="82" cy="95" r="10" stroke="#333" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="118" cy="95" r="10" stroke="#333" stroke-width="1.5" fill="none" opacity="0.7"/>
  <line x1="92" y1="95" x2="108" y2="95" stroke="#333" stroke-width="1.5" opacity="0.7"/>
  <line x1="72" y1="95" x2="64" y2="92" stroke="#333" stroke-width="1.5" opacity="0.7"/>
  <line x1="128" y1="95" x2="136" y2="92" stroke="#333" stroke-width="1.5" opacity="0.7"/>

  <!-- Nose -->
  <path d="M96 102 Q94 115 92 122 Q96 127 100 126 Q104 127 108 122 Q106 115 104 102 Z" fill="url(#ssSkin)" stroke="#a08055" stroke-width="0.5"/>

  <!-- Mouth (flat/serious, slight frown) -->
  <path d="M86 135 Q100 134 114 135" stroke="#a04040" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Cheek lines (older look) -->
  <path d="M65 112 Q70 118 74 116" stroke="#c8a070" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M135 112 Q130 118 126 116" stroke="#c8a070" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Moustache (subtle) -->
  <path d="M88 130 Q95 128 100 130 Q105 128 112 130" stroke="#5d4e3a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Chin -->
  <path d="M82 140 Q100 152 118 140" stroke="#c8a070" stroke-width="0.5" fill="none" opacity="0.3"/>
</svg>